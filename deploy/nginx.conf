# Nginx конфіг для fish-shop
# Замінити YOUR_DOMAIN на реальний домен, наприклад valigura.com.ua
# Скопіювати в /etc/nginx/sites-available/fish-shop
# Потім: sudo ln -s /etc/nginx/sites-available/fish-shop /etc/nginx/sites-enabled/fish-shop

# Шлях до uploads на сервері — змінити якщо проєкт в іншій папці
# Наприклад: /var/www/fish-shop/apps/backend/uploads
set $uploads_path /var/www/fish-shop/apps/backend/uploads;

# HTTP → redirect to HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # SSL — видає certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Розмір тіла запиту (для завантаження фото)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- Uploads: nginx роздає файли напряму (швидше ніж через NestJS) ---
    location /uploads/ {
        alias $uploads_path/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # --- Backend API: /api/* → NestJS на порту 4000 ---
    # NestJS має глобальний prefix /api, тому шлях зберігається як є
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Підтримка cookies (refresh token)
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;

        # WebSocket для майбутніх фіч (опційно)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Swagger docs (тільки з localhost або за потреби — прибери в продакшн) ---
    location /docs {
        proxy_pass       http://127.0.0.1:4000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend: Next.js на порту 3000 ---
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Підтримка Next.js hot reload (для dev) — не потрібне в продакшн,
        # але не шкодить
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
