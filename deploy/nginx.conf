# Nginx конфіг для valigura-fish.com
#
# Встановлення:
#   cp /var/www/fish-shop/deploy/nginx.conf /etc/nginx/sites-available/fish-shop
#   ln -s /etc/nginx/sites-available/fish-shop /etc/nginx/sites-enabled/fish-shop
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d valigura-fish.com -d www.valigura-fish.com
#
# Конфіг навмисно тільки на порту 80: certbot сам допише HTTPS (443),
# сертифікати та редирект http → https. Інші сайти на сервері (fish-erp) не зачіпаються,
# бо nginx розводить запити за server_name.

server {
    listen 80;
    listen [::]:80;
    server_name valigura-fish.com www.valigura-fish.com;

    # Розмір тіла запиту (для завантаження фото)
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # --- Uploads: nginx роздає файли напряму (швидше ніж через NestJS) ---
    location /uploads/ {
        alias /var/www/fish-shop/apps/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # --- Backend API: /api/* → NestJS на порту 4000 (global prefix /api зберігається) ---
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # --- Frontend: Next.js на порту 3100 (3000 зайнятий fish-erp) ---
    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
